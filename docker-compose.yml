
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: training
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d training"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/training
      JWT_SECRET: dev-secret-change-me
      JWT_ALG: HS256
      CORS_ORIGIN: "*"
      PROTECTED_DIR: /app/protected_site
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./frontend/hidden-site:/app/protected_site:ro

  frontend:
    build: ./frontend
    ports:
      - "8080:80"

volumes:
  db_data:
