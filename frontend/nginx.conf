server {
    listen 80;
    server_name _;
    
    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=10s;
    
    # Serve static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # Proxy API requests to backend (strips /api prefix)
    location /api/ {
        # Use variable to enable runtime DNS resolution
        set $backend_upstream backend;
        
        # Rewrite to strip /api prefix and proxy
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$backend_upstream:8000;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
